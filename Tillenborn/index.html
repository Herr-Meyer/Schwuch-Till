<style>
/* Layout: Vollbild-Spielfläche; quer = Steuerung liegt über dem Bild, hochkant = Steuerung darunter */
:root{
  --bg:#120d0a; --stone:#211913; --stone2:#33271e; --line:#5a4430;
  --gold:#e3a548; --gold2:#ffd27a; --jade:#4fa38a; --parch:#f2e4c6; --muted:#b9a585; --blood:#d0533a;
  --f-display:'Cinzel', 'Trajan Pro', Georgia, serif;
  --f-body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  --f-pixel:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--bg);color:var(--parch);overflow:hidden}
body{font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
body.portrait #app{justify-content:flex-start;padding:env(safe-area-inset-top,0px) 0 0}
body.portrait #cv{border-radius:0;box-shadow:0 1px 0 #3a2c20,0 10px 30px #000a}
#bezel{display:none;font:700 12px var(--f-display);letter-spacing:.32em;color:#7a5e40;text-align:center;padding-top:22px;pointer-events:none;line-height:1.6}
#bezel small{display:block;font:800 9px var(--f-pixel);letter-spacing:.28em;color:#5a4430}
#bezel i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#d0533a;box-shadow:0 0 8px #d0533a;margin-right:10px;vertical-align:1px}
body.portrait.ingame #bezel{display:block}
#rot{display:none}
body.portrait #ov:has(.title-wrap){align-items:flex-start;padding-top:calc(var(--cvh,0px) + 22px)}
body.portrait #rot{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
#rot svg{flex:none;animation:rot 2.6s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){#rot svg{animation:none}}
#stage{position:relative;line-height:0;flex:none}
#cv{display:block;border-radius:6px;box-shadow:0 0 0 1px #3a2c20,0 12px 40px #000c;background:#000}
/* ---------- Touch-Steuerung ---------- */
#pad{display:none;width:100%;box-sizing:border-box;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
body.touch #pad{display:flex}
body:not(.ingame) #pad{visibility:hidden}
[hidden]{display:none!important}
body.touch:not(.portrait) #pad{position:absolute;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:5}
body.touch.portrait #pad{flex:1;align-items:flex-end;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.pg{display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
.pg.right{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px}
#dpad{display:flex;width:150px;height:78px;border-radius:40px;border:2px solid #e3a54866;background:#1a120ccc;overflow:hidden;touch-action:none}
body:not(.portrait) #dpad{background:#1a120c88}
#dpad div{flex:1;display:flex;align-items:center;justify-content:center;font:800 23px var(--f-pixel);color:var(--gold2)}
#dpad div.on{background:#e3a54844}
.b{width:66px;height:66px;border-radius:50%;border:2px solid #e3a548aa;background:#1a120ccc;color:var(--gold2);font:800 13px var(--f-pixel);display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;touch-action:none}
body:not(.portrait) .b{background:#1a120c88}
.b.sm{width:48px;height:48px;font-size:11px;align-self:end;justify-self:end}
.b.on{background:#e3a54855;transform:scale(.95)}
.b.big{width:74px;height:74px}
#bSV.ready{border-color:var(--jade);color:#bff3df;box-shadow:0 0 14px #4fa38a}
#bSV.off{opacity:.25}
body.portrait .b{width:72px;height:72px}
body.portrait .b.big{width:82px;height:82px}
body.portrait .b.sm{width:54px;height:54px}
body.portrait #dpad{width:170px;height:86px}
#pauseBtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6px);right:max(18px,calc(env(safe-area-inset-right,0px) + 6px));z-index:6;width:38px;height:38px;border-radius:50%;border:1px solid #e3a54888;background:#1a120cb0;color:var(--gold2);font:800 15px var(--f-pixel);display:none;align-items:center;justify-content:center;cursor:pointer}
body.ingame #pauseBtn{display:flex}
/* ---------- Overlays ---------- */
#ov{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%,#2a1d12cc,#0b0806f0)}
#ov.clear{background:transparent;pointer-events:none}
#ov.clear>*{pointer-events:auto}
.panel{touch-action:pan-y;width:100%;max-width:560px;max-height:100%;overflow:auto;box-sizing:border-box;background:linear-gradient(#2a2018,#1c1510);border:1px solid var(--line);outline:1px solid #e3a54833;outline-offset:-6px;border-radius:10px;padding:22px 20px;box-shadow:0 20px 60px #000b;color:var(--parch)}
.eyebrow{font:800 13px var(--f-pixel);letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;color:var(--gold2)}
h1{font-size:clamp(28px,7vw,52px);font-weight:900;letter-spacing:.04em;line-height:1.02;text-shadow:0 0 24px #e3a54866,0 3px 0 #5a3a12}
h2{font-size:clamp(20px,4.6vw,30px);font-weight:900;line-height:1.1}
h3{font-size:17px;font-weight:700}
p{margin:0;line-height:1.45;font-size:16px}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{font:800 14px var(--f-pixel);letter-spacing:.06em;padding:13px 16px;border-radius:8px;border:1px solid var(--gold);background:linear-gradient(#e3a548,#b97a26);color:#1c1108;cursor:pointer;text-transform:uppercase}
.btn.ghost{background:transparent;color:var(--gold2);border-color:#e3a54888}
.btn:focus-visible,.opt:focus-visible,.stg:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.title-wrap{max-width:620px;width:100%;text-align:left;display:flex;flex-direction:column;gap:16px}
.title-sub{font:600 18px var(--f-display);color:var(--parch);letter-spacing:.06em}
.title-foot{font-size:14px;color:var(--muted)}
.keys{font-size:14px;color:var(--muted);line-height:1.5}
.keys b{font:800 13px var(--f-pixel);color:var(--gold2);padding:2px 5px;border:1px solid #e3a54866;border-radius:4px;margin-right:2px}
/* Fall-Karte */
.case{background:linear-gradient(#efe0bd,#dcc79b);color:#2a1c10;border:none;outline:2px solid #8a6a3a;outline-offset:-8px}
.case h2{color:#5a2e10}
.case .eyebrow{color:#8a4b1a}
.opt{display:block;width:100%;text-align:left;font:500 16px var(--f-body);padding:12px 14px;border-radius:8px;border:1px solid #8a6a3a;background:#f7ecd2;color:#2a1c10;cursor:pointer;line-height:1.3}
.opt:active{background:#ead8b0}
.fb{padding:12px 14px;border-radius:8px;font-size:16px;line-height:1.4}
.fb.ok{background:#3f7a5f;color:#effff6}
.fb.no{background:#8a3a26;color:#fff1ea}
/* Dialog */
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:25;display:none;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
#dlg .box{max-width:640px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;background:#1c1510f2;border:1px solid var(--gold);border-radius:10px;padding:12px;box-shadow:0 10px 40px #000c;cursor:pointer}
#dlg canvas{width:64px;height:64px;flex:none;border-radius:6px;background:#2a2018;border:1px solid var(--line)}
#dlg .who{font:800 13px var(--f-pixel);color:var(--gold);letter-spacing:.08em;margin-bottom:4px}
#dlg .txt{font-size:17px;line-height:1.4;min-height:2.8em}
#dlg .nx{font:800 12px var(--f-pixel);color:var(--muted);text-align:right;margin-top:4px}
#dlg.narr canvas{display:none}
#dlg.narr .txt{font-style:italic;color:#f7e9c9}
/* Karte */
.map-world{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.map-world h3{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.map-world h3 small{font:400 14px var(--f-body);color:var(--muted)}
.stg{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#2a2018;color:var(--parch);cursor:pointer;font:16px var(--f-body)}
.stg .code{font:800 13px var(--f-pixel);color:var(--gold)}
.stg .nm{min-width:0}
.stg .nm small{display:block;color:var(--muted);font-size:13px}
.stg .st{font:800 12px var(--f-pixel);padding:4px 7px;border-radius:999px;border:1px solid #e3a54866;color:var(--gold2);white-space:nowrap}
.stg.done .st{background:#3f7a5f;border-color:#3f7a5f;color:#effff6}
.stg.lock{opacity:.45;cursor:default}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:800 12px var(--f-pixel);padding:6px 8px;border-radius:6px;background:#33271e;color:var(--gold2);letter-spacing:.04em}
/* Urkunde */
.cert{background:linear-gradient(#f3e6c8,#e2cd9f);color:#2a1c10;text-align:center;border:none;outline:3px double #8a6a3a;outline-offset:-10px}
.cert h1{color:#6a3a12;text-shadow:none;font-size:clamp(24px,6vw,40px)}
.cert h2{color:#2a1c10}
.cert .eyebrow{color:#8a4b1a}
.seal{width:76px;height:76px;margin:6px auto 0;border-radius:50%;background:radial-gradient(#d84a2e,#8a2414);color:#ffe9c2;display:flex;align-items:center;justify-content:center;font:900 13px var(--f-display);box-shadow:0 0 0 4px #b2381f66;text-align:center;line-height:1.05}
.hsf{position:absolute;right:max(20px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:none;border:1px solid transparent;border-radius:4px;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;color:#fff}
.hsf:hover,.hsf:focus-visible{background:#ffffff22;border-color:#ffffff55;outline:none}
.hsf-ic{position:relative;width:64px;height:48px}
.hsf-ic .tab{position:absolute;left:2px;top:0;width:26px;height:10px;background:#e8b84a;border-radius:3px 3px 0 0}
.hsf-ic .body{position:absolute;left:0;top:6px;width:64px;height:42px;background:linear-gradient(#f9dc7a,#e9b94c);border-radius:3px;box-shadow:0 2px 4px #0006;display:flex;align-items:center;justify-content:center;font:900 22px 'Segoe UI',system-ui,sans-serif;color:#6a4a10;letter-spacing:.02em}
.hsf-ic svg{position:absolute;right:3px;bottom:2px;width:16px;height:16px}
.hsf-l{font-size:12px;text-shadow:0 1px 2px #000}
.win{width:100%;max-width:420px;background:#f0f0f0;color:#1a1a1a;border:1px solid #6a7a8a;box-shadow:0 18px 50px #000c;font-family:'Segoe UI',system-ui,sans-serif;border-radius:6px;overflow:hidden}
.win .bar{background:linear-gradient(#3a6ab0,#2b5797);color:#fff;font-size:13px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center}
.win .bd{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.4}
.win .bt{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.win button{font:14px 'Segoe UI',system-ui,sans-serif;padding:6px 16px;border:1px solid #8a9aaa;background:#e6e6e6;border-radius:3px;cursor:pointer;color:#1a1a1a}
.win button.pri{border-color:#2b5797;box-shadow:inset 0 0 0 1px #2b5797}
.win canvas{width:100%;max-width:388px;aspect-ratio:4/3;image-rendering:pixelated;background:#000;display:block}
.msgc{width:100%;max-width:380px;background:#ffffff;color:#1a1f2a;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px #000c;font-family:'Segoe UI',system-ui,sans-serif}
.msgc .top{background:#1f3a5f;color:#fff;font-size:13px;padding:8px 12px;display:flex;justify-content:space-between}
.msgc .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.msgc .who{display:flex;gap:10px;align-items:center}
.msgc .av{width:38px;height:38px;border-radius:50%;background:#c46a9a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.msgc .sub{font-weight:800;color:#b8202a;font-size:16px}
.msgc .txt{font-size:15px;line-height:1.45}
.msgc .ft{font-size:12px;color:#6a7280}
.msgc button{align-self:flex-end;font:600 14px 'Segoe UI',system-ui,sans-serif;padding:8px 14px;border:none;border-radius:6px;background:#1f3a5f;color:#fff;cursor:pointer}
#saar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:50%;transform:translateX(-50%) translateY(-8px);z-index:31;width:min(88%,440px);box-sizing:border-box;background:#1c1510f2;border:1.5px solid #d0533a;border-radius:10px;padding:9px 13px;color:var(--parch);font:600 15px var(--f-body);line-height:1.35;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;box-shadow:0 10px 30px #000a}
#saar.on{opacity:1;transform:translateX(-50%) translateY(0)}
#saar b{display:block;font:800 11px var(--f-pixel);letter-spacing:.1em;color:#ff8a6a;text-transform:uppercase;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){#saar{transition:none}}
.letter{background:linear-gradient(#fbf4e2,#efe0bf);color:#2a1c10;border:none;outline:2px solid #b89a6a;outline-offset:-8px}
.letter .eyebrow{color:#8a4b1a}
.cert .btn.ghost,.letter .btn.ghost{color:#6a3a12;border-color:#8a6a3a}
.letter .lt-head{display:flex;gap:14px;align-items:center}
.letter canvas{width:84px;height:84px;flex:none;border-radius:50%;background:#2a2018;border:2px solid #b89a6a}
.letter .hand{font:600 clamp(22px,5.4vw,28px)/1.25 'Caveat','Segoe Print','Comic Sans MS',cursive;color:#23305a}
.letter .sig{font:700 clamp(24px,6vw,30px) 'Caveat','Segoe Print','Comic Sans MS',cursive;color:#23305a;text-align:right}
#toast{position:absolute;top:calc(env(safe-area-inset-top,0px) + 50px);left:50%;transform:translateX(-50%);z-index:30;font:800 13px var(--f-pixel);background:#1c1510ee;border:1px solid var(--gold);color:var(--gold2);padding:8px 12px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="cv" width="400" height="240"></canvas></div>
  <div id="bezel" aria-hidden="true"><i></i>TILLENBORN · RAIDER<small>MEYER-MAN EDITION · MIT STEREO-SOUND</small></div>

  <div id="dlg"><div class="box"><canvas width="128" height="128"></canvas><div style="flex:1;min-width:0"><div class="who"></div><div class="txt"></div><div class="nx">TIPPEN ▼</div></div></div></div>
  <div id="toast"></div>
  <div id="saar" role="status" aria-live="polite"><b>Meyer-Man</b><span></span></div>
</div>

<script>
(()=>{
'use strict';
const TS=16, ROWS=15, VH=ROWS*TS, FLOOR=13*TS;
const $=s=>document.querySelector(s);
const cv=$('#cv'), ctx=cv.getContext('2d');
let VW=400, K=2, portrait=false, touch=false;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ================= Speicherstand ================= */
const SKEY='tillenborn-raider-final';
let save={done:[],records:[],solved:[],chalk:0,deaths:0,test:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&Array.isArray(s.done))save=Object.assign(save,s);}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
const unlocked=()=>{if(save.test)return STAGES.length-1;let u=0;for(let i=0;i<STAGES.length;i++){if(save.done.includes(i))u=i+1;}return Math.min(u,STAGES.length-1);};

/* ================= Inhalte ================= */
const WORLDS=[
 {name:'Bonn',sub:'Altbau, Rhein und Mietwahnsinn'},
 {name:'Die Schule in Ruinen',sub:'Nach der Flut: Schlamm, Trümmer, Vorbereitungsdienst'},
 {name:'Container-Landschaft',sub:'Baustelle, Container, Raumnummern als Vorschlag'},
 {name:'Das Studienseminar',sub:'Der Tempel der Kompetenzraster'},
 {name:'Irland',sub:'Austausch, Pub-Tour und Live-Musik'}
];
const WORLD_ORDER=[0,1,4,2,3];
const wnum=w=>WORLD_ORDER.indexOf(w)+1;
const STAGES=[
 {code:'1-1',w:0,name:'Bonner Altbau',cut:'saar',len:120,diff:0,seed:3,boss:'beethoven',rec:['r1'],ev:[{at:.03,k:'M',d:'m_start'},{at:.3,k:'A',c:0},{at:.5,k:'M',d:'m_rlp'},{at:.76,k:'A',c:1}]},
 {code:'1-2',w:0,name:'Am Rheinufer',len:130,diff:1,seed:7,boss:'makler',rec:['r2','r3'],ev:[{at:.12,k:'Z'},{at:.38,k:'A',c:2},{at:.6,k:'M',d:'m_ahr'},{at:.82,k:'A',c:3}]},
 {code:'2-1',w:1,name:'Der geflutete Flur',after:'tisch',len:130,diff:1,seed:21,boss:'brass',ev:[{at:.05,k:'M',d:'m_brass'},{at:.3,k:'A',c:4},{at:.55,k:'A',c:9},{at:.8,k:'A',c:5}]},
 {code:'2-2',w:1,name:'Turnhallen-Ruine',len:135,diff:2,seed:34,boss:'fett',ev:[{at:.05,k:'L'},{at:.38,k:'A',c:6},{at:.6,k:'M',d:'m_fett'},{at:.82,k:'A',c:8}]},
 {code:'2-3',w:1,name:'Der Raucherhof',len:140,diff:2,seed:55,boss:'smokers',ev:[{at:.34,k:'A',c:7},{at:.56,k:'M',d:'m_smoke'},{at:.8,k:'A',c:10}]},
 {code:'2-4',w:1,name:'Fachkonferenz Deutsch',len:145,diff:3,seed:89,boss:'fachko',ev:[{at:.18,k:'B'},{at:.36,k:'A',c:34},{at:.56,k:'M',d:'m_rebell'},{at:.72,k:'A',c:35},{at:.88,k:'A',c:11}]},
 {code:'2-5',w:1,name:'Frühstückspause',peace:1,diner:1,len:70,diff:0,seed:77,boss:null,ev:[],

function layout(){
  const app=$('#app'), cs=getComputedStyle(app);
  touch=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
  document.body.classList.toggle('touch',touch);
  const w=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const h=app.clientHeight;
  portrait=touch&&w/h<1.1;
  document.body.classList.toggle('portrait',portrait);
  let cw,ch;
  if(portrait){VW=256;cw=app.clientWidth;ch=cw*VH/VW;if(ch>h*.6){ch=h*.6;cw=ch*VW/VH;}}
  else{VW=Math.round(clamp(VH*w/Math.max(1,h),320,540));ch=h;cw=ch*VW/VH;if(cw>w){cw=w;ch=cw*VH/VW;}}
  cv.style.width=Math.floor(cw)+'px';cv.style.height=Math.floor(ch)+'px';document.documentElement.style.setProperty('--cvh',Math.floor(ch)+'px');
  {const dl=$('#dlg'),stg=$('#stage');if(portrait){dl.style.top=(stg.offsetTop+Math.floor(ch)+8)+'px';dl.style.bottom='auto';}else{dl.style.top='';dl.style.bottom='';}}
  const dpr=window.devicePixelRatio||1;
  K=clamp(ch*dpr/VH,1,3);
  cv.width=VW*K;cv.height=VH*K;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  bgCache={};
}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function genPeace(S){
  const W=S.len,g=[];for(let r=0;r<ROWS;r++)g.push(new Uint8Array(W));
  for(let c=0;c<W;c++){g[13][c]=1;g[14][c]=1;}
  [18,34,50].forEach(t=>{for(let c=t;c<t+4;c++)g[10][c]=2;});
  const gx=c=>c*TS+8, ents=[{k:'deco',v:9,x:gx(9),y:FLOOR}];
  [[14,FLOOR-14],[20,10*TS-14],[30,FLOOR-14],[36,10*TS-14],[52,10*TS-14]].forEach((f,i)=>ents.push({k:'food',v:i,x:gx(f[0]),y:f[1]}));
  for(let c=40;c<46;c++)ents.push({k:'chalk',x:gx(c),y:FLOOR-26});
  ents.push({k:'X',x:gx(W-6),y:FLOOR});
  return {grid:g,w:W,ents,start:{x:3*TS,y:FLOOR}};
}
function genLevel(S){
  if(S.peace)return genPeace(S);
  const R=rng(S.seed*977+13), d=S.diff;
  const cols=[]; let h=2;
  const add=(n,o={})=>{for(let i=0;i<n;i++)cols.push({h:o.pit?0:(o.h!=null?o.h:h),liq:!!o.liq,spike:!!o.spike,plat:o.plat!=null?o.plat:-1,flat:!!o.flat});};

    const fl=4+(R()*5|0), a=cols.length; add(fl,{flat:1}); flats.push({a,b:a+fl-1});
    const p=R();

    else if(p<.55){const g=2+(R()*(d>2?3:2)|0);add(g,{liq:1});add(1);}

    else if(p<.86){add(1);add(R()<.45?2:1,{spike:1});add(1);}
    else{add(1);add(2,{h:Math.min(8,h+2)});add(1);}
  }
  const ea=cols.length; add(16,{flat:1}); flats.push({a:ea,b:ea+15,end:1});
  const W=cols.length, g=[];
  for(let r=0;r<ROWS;r++)g.push(new Uint8Array(W));
  cols.forEach((c,x)=>{if(c.h>0){for(let r=ROWS-c.h;r<ROWS;r++)g[r][x]=1;if(c.liq)g[ROWS-c.h][x]=4;if(c.spike)g[ROWS-c.h-1][x]=3;}if(c.plat>=0)g[c.plat][x]=2;});
  const gx=c=>c*TS+8, gy=c=>(ROWS-cols[c].h)*TS;
  const ents=[], used=new Set();
  // Ereignisse (Meyer-Man, Fälle, Helfer)
  S.ev.forEach(e=>{
    let best=-1,bd=1e9;const target=e.at*W;
    flats.forEach((f,i)=>{if(f.end)return;if(f.start&&e.at>.08)return;if(used.has(i)&&!f.start)return;const m=(f.a+f.b)/2,dd=Math.abs(m-target);if(dd<bd){bd=dd;best=i;}});
    if(best<0)return;used.add(best);const f=flats[best];
    const c=f.start?7:Math.floor((f.a+f.b)/2);
    ents.push(Object.assign({x:gx(c),y:gy(c)},e));
  });
  // Checkpoints
  [.33,.62].forEach(fr=>{let best=-1,bd=1e9;flats.forEach((f,i)=>{if(used.has(i)||f.start||f.end)return;const dd=Math.abs((f.a+f.b)/2-fr*W);if(dd<bd){bd=dd;best=i;}});if(best>=0){used.add(best);const f=flats[best];ents.push({k:'cp',x:gx(f.a+1),y:gy(f.a+1)});}});

  flats.forEach((f,i)=>{

    const len=f.b-f.a+1;

      const r=R(), c=f.a+1+(R()*(len-2)|0);

      else if(r<.76)ents.push({k:'fly',x:gx(c),y:gy(c)-3*TS});
      else ents.push({k:d>=1?'throw':'walk',x:gx(c),y:gy(c)});
      if(d>=3&&R()<.25)ents.push({k:'fly',x:gx(f.a),y:gy(f.a)-4*TS});
    }

  for(let n=0;n<2;n++){if(!free.length)break;const i=free.splice(R()*free.length|0,1)[0];const f=flats[i];ents.push({k:'coffee',x:gx(f.b),y:gy(f.b)-14});}
  for(let n=0;n<2;n++){if(!free.length)break;const i=free.splice(R()*free.length|0,1)[0];const f=flats[i];ents.push({k:'pint',x:gx(f.a+1),y:gy(f.a+1)-14});}
  // Manfreds-Platten (hoch platziert)
  if(S.rec){const plats=[];for(let c=1;c<W;c++){if(cols[c].plat>=0&&cols[c-1].plat<0)plats.push(c);}
    S.rec.forEach((id,n)=>{let c,y;if(plats.length){c=plats.splice(Math.floor(plats.length*(n+1)/(S.rec.length+1))%plats.length,1)[0];y=cols[c].plat*TS-46;}else{c=10+n*20;y=gy(c)-58;}ents.push({k:'rec',id,x:gx(c)+4,y});});}

}

function buildArena(){
  AW=Math.max(22,Math.ceil(VW/TS));
  const g=[];for(let r=0;r<ROWS;r++)g.push(new Uint8Array(AW));
  for(let c=0;c<AW;c++){g[13][c]=1;g[14][c]=1;}
  for(let r=0;r<ROWS;r++){g[r][0]=1;g[r][AW-1]=1;}
  for(let c=3;c<=6;c++)g[9][c]=2;
  for(let c=AW-7;c<=AW-4;c++)g[9][c]=2;
  const m=Math.floor(AW/2);for(let c=m-2;c<=m+1;c++)g[6][c]=2;

function tileAt(c,r){if(r<0||r>=ROWS)return 0;if(c<0||c>=lev.w)return 1;return lev.grid[r][c];}

function moveX(o){
  o.hitW=false;o.x+=o.vx;

  if(o.vx>0){const c=Math.floor((o.x+o.w-.01)/TS);for(let r=r0;r<=r1;r++)if(solidAt(c,r)){o.x=c*TS-o.w;o.vx=0;o.hitW=true;break;}}

}
function moveY(o){
  const oldB=o.y+o.h;o.y+=o.vy;o.on=false;
  const c0=Math.floor(o.x/TS), c1=Math.floor((o.x+o.w-.01)/TS);
  if(o.vy>0){const r=Math.floor((o.y+o.h-.01)/TS);for(let c=c0;c<=c1;c++){const t=tileAt(c,r);if(t===1||(t===2&&oldB<=r*TS+.5)){o.y=r*TS-o.h;o.vy=0;o.on=true;break;}}}
  else if(o.vy<0){const r=Math.floor(o.y/TS);for(let c=c0;c<=c1;c++)if(solidAt(c,r)){o.y=(r+1)*TS;o.vy=0;break;}}
}

function explode(s){
  const cx=s.x+s.w/2, cy=s.y+s.h/2;
  burst(cx,cy,'#f3e7c9',14,2.6);burst(cx,cy,'#1a1210',8,2);sfx(140,.25,'sawtooth',.12,60);shake(3);
  const area={x:cx-28,y:cy-28,w:56,h:56};

  bosses.forEach(b=>{if(!b.dead&&ov(area,b)){if(b.type==='rory')roryDrink(b);else if(noDrink(b));else dmgBoss(b,3);}});
  s.life=0;
}
function updateShots(){
  for(const s of shots){
    s.life--;
    if(s.k==='ki'){s.x+=s.vx;if(solidAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h/2)/TS))){s.life=0;burst(s.x+5,s.y+3,'#9ff0ff',5,1.5);}}
    else if(s.k==='pint'){s.vy+=.25;s.x+=s.vx;s.y+=s.vy;const t=tileAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h)/TS));if(t===1||t===2||solidAt(Math.floor((s.x+s.w/2)/TS),Math.floor((s.y+s.h/2)/TS))||s.y>VH){explode(s);continue;}}
    else if(s.k==='hose'){s.spin+=.45;if(s.out>0){s.out--;s.x+=s.vx;if(s.out===0)s.hit.clear();}else{const dx=P.x+P.w/2-(s.x+6),dy=P.y+10-(s.y+6),dd=Math.hypot(dx,dy)||1;s.x+=dx/dd*5.2;s.y+=dy/dd*5.2;if(dd<10)s.life=0;}}
    if(s.life<=0)continue;
    for(const e of enemies){if(e.dead||!ov(s,e))continue;
      if(s.k==='ki'){dmgEnemy(e,1);s.life=0;break;}
      if(s.k==='pint'){explode(s);break;}
      if(s.k==='hose'&&!s.hit.has(e)){s.hit.add(e);dmgEnemy(e,2);}
    }
    if(s.life<=0)continue;
    for(const b of bosses){if(b.dead||!ov(s,b))continue;
      if(s.k==='ki'){dmgBoss(b,1);s.life=0;break;}
      if(s.k==='pint'&&noDrink(b)){s.life=0;break;}
      if(s.k==='pint'){explode(s);break;}
      if(s.k==='hose'&&!s.hit.has(b)){s.hit.add(b);dmgBoss(b,2);}
    }
  }

function shade(col,f){
  if(typeof col!=='string'||col[0]!=='#'||col.length<7)return col;
  let r=parseInt(col.substr(1,2),16),g=parseInt(col.substr(3,2),16),b=parseInt(col.substr(5,2),16);const a=col.length>7?col.substr(7):'';
  if(f>0){r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}else{r*=1+f;g*=1+f;b*=1+f;}
  return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')+a;
}
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function cyl(c,x,y,w,h,col,r){const g=c.createLinearGradient(x,0,x+w,0);g.addColorStop(0,shade(col,-.3));g.addColorStop(.42,shade(col,.2));g.addColorStop(.62,col);g.addColorStop(1,shade(col,-.42));c.fillStyle=g;rr(c,x,y,w,h,r==null?Math.min(w,h)*.3:r);c.fill();}
function vgrad(c,x,y,w,h,col,r){const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,shade(col,.22));g.addColorStop(1,shade(col,-.3));c.fillStyle=g;rr(c,x,y,w,h,r||0);c.fill();}
function ball(c,x,y,rx,ry,col){const g=c.createRadialGradient(x-rx*.35,y-ry*.4,Math.max(.1,rx*.1),x,y,Math.max(rx,ry)*1.15);g.addColorStop(0,shade(col,.35));g.addColorStop(.55,col);g.addColorStop(1,shade(col,-.4));c.fillStyle=g;c.beginPath();c.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,7);c.fill();}
function bx(x,y,w,h,col,d){d=d==null?6:d;const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,shade(col,.1));g.addColorStop(1,shade(col,-.22));
  if(d>0){ctx.fillStyle=shade(col,-.38);ctx.beginPath();ctx.moveTo(x+w,y);ctx.lineTo(x+w+d,y-d*.8);ctx.lineTo(x+w+d,y+h-d*.8);ctx.lineTo(x+w,y+h);ctx.closePath();ctx.fill();
    ctx.fillStyle=shade(col,.18);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+d,y-d*.8);ctx.lineTo(x+w+d,y-d*.8);ctx.lineTo(x+w,y);ctx.closePath();ctx.fill();}
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);}
function pillar(x,y,w,h,col){const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,shade(col,-.35));g.addColorStop(.35,shade(col,.25));g.addColorStop(.6,col);g.addColorStop(1,shade(col,-.5));ctx.fillStyle=g;ctx.fillRect(x,y,w,h);}
function groundAt(x,y){const c=Math.floor(x/TS);for(let r=Math.max(0,Math.floor((y-2)/TS));r<ROWS;r++){const t=tileAt(c,r);if(t===1||t===2)return r*TS;}return null;}
function shadowAt(x,y,w){if(!lev)return;const gy=groundAt(x,y);if(gy==null)return;const d=Math.max(0,gy-y),k=1-Math.min(1,d/110);if(k<=0)return;
  const g=ctx.createRadialGradient(x+1.5,gy-1.6,0,x+1.5,gy-1.6,w*(.55+.45*k));g.addColorStop(0,'rgba(0,0,0,'+(.42*k)+')');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.save();ctx.translate(x+1.5,gy-1.6);ctx.scale(1,.28);ctx.translate(-(x+1.5),-(gy-1.6));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x+1.5,gy-1.6,w*(.55+.45*k),0,7);ctx.fill();ctx.restore();}

function drawBunny(c,W,H,v){
  const bg=['#bfe3a0','#f2d6e0','#c8dcf0','#f4e2b0'][v],fur=['#ffffff','#a8784a','#9a9a9e','#f4f0e8'][v];
  c.fillStyle=bg;c.fillRect(0,0,W,H);c.fillStyle='#6aa84a';c.fillRect(0,H*.78,W,H*.22);
  c.fillStyle=fur;c.beginPath();c.ellipse(W*.46,H*.62,W*.2,H*.18,0,0,7);c.fill();
  c.beginPath();c.arc(W*.64,H*.44,H*.13,0,7);c.fill();
  c.save();c.translate(W*.6,H*.3);c.rotate(-.25);c.beginPath();c.ellipse(0,-H*.1,W*.03,H*.14,0,0,7);c.fill();c.restore();
  c.save();c.translate(W*.68,H*.3);c.rotate(.2);c.beginPath();c.ellipse(0,-H*.1,W*.03,H*.14,0,0,7);c.fill();c.restore();
  if(v===3){c.fillStyle='#3a3a3a';c.beginPath();c.ellipse(W*.42,H*.6,W*.08,H*.08,0,0,7);c.fill();}
  c.fillStyle='#ffffff';c.beginPath();c.arc(W*.27,H*.6,H*.05,0,7);c.fill();
  c.fillStyle='#222';c.beginPath();c.arc(W*.67,H*.42,H*.022,0,7);c.fill();
  c.fillStyle='#e88a9a';c.beginPath();c.arc(W*.76,H*.47,H*.018,0,7);c.fill();
  c.fillStyle='#ff8a2a';c.beginPath();c.moveTo(W*.8,H*.62);c.lineTo(W*.95,H*.66);c.lineTo(W*.8,H*.68);c.fill();c.fillStyle='#4a9a3a';c.fillRect(W*.78,H*.6,W*.03,H*.03);
}
function showHsShow(){
  setOv(`<div class="win" role="dialog" aria-label="HS"><div class="bar"><span>HS – Bildanzeige</span><span>✕</span></div><div class="bd"><canvas id="hsCv" width="384" height="288"></canvas><div id="hsCap">Bild wird geladen…</div><div class="bt"><button id="hsX">Schließen</button></div></div></div>`);
  const cvs=$('#hsCv'),c=cvs.getContext('2d'),off=document.createElement('canvas'),oc=off.getContext('2d');
  const caps=['Hase Nr. 1: sehr flauschig','Hase Nr. 2: extrem flauschig','Hase Nr. 3: flauschig, aber reserviert','Hase Nr. 4: der Flauschigste von allen'];
  const res=[5,7,10,14,20,30,48,96,384];let slide=0,step=0,done=false;
  const stop=()=>{if(done)return;done=true;clearInterval(iv);showTitle();};
  $('#hsX').addEventListener('click',stop);
  const iv=setInterval(()=>{
    if(done)return;
    const r=res[Math.min(step,res.length-1)];off.width=r;off.height=Math.round(r*.75);drawBunny(oc,off.width,off.height,slide);
    c.imageSmoothingEnabled=false;c.clearRect(0,0,384,288);c.drawImage(off,0,0,384,288);
